# Gradle Specifications
org.gradle.jvmargs=-Xms256M -Xmx2G
org.gradle.daemon=false

# General Specifications
mc_version=1.12.2
mod_version=1.1.0
# DO NOT RAISE THIS. 14.23.5.2847 is the last 1.12.2 Forge build that publishes a
# `-userdev.jar` artifact. Builds 2848+ publish only `-userdev3.jar`, which is the
# ForgeGradle 3 format that the ForgeGradle 2.3 fork used here cannot consume - the
# download 404s and the build fails. This is a toolchain ceiling, not a bug.
# It does not limit what players can run: 1.12.2 Forge is binary-compatible across
# these builds, so a mod compiled against 2847 runs fine on 2860 (what RLCraft uses).
forge_version=14.23.5.2847
mod_group=com.exiledradio
mod_id=rlcraftvillagertomes
mod_name=RLCraft Villager Tomes
mod_archives_name=RLCraftVillagerTomes
mod_author=ExiledRadio
mod_description=Teach villagers the enchanted books you find. Hand a villager a book and it learns that enchantment as a permanent trade priced in emeralds; hand it a duplicate and the trade levels up by anvil rules.
mod_credits=Unofficial RLCraft addon by ExiledRadio. Not affiliated with the RLCraft team.
mod_url=https://github.com/ExiledRadio/RLCraftVillagerTomes

# Dev-only: set `deployDir` in ~/.gradle/gradle.properties to auto-copy the
# built jar into a test instance's mods folder. Deliberately not set here so
# the build stays machine-independent.
